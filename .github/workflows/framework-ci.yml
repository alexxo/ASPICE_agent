# framework-ci.yml — the framework's own CI: its self-test suite and ruff.
#
# One run per change: a push to main, or a pull request. A release tag starts no
# run of its own; tag only a commit whose full run passed (start one by hand with
# `gh workflow run framework-ci` when its push ran the consistency tests only).
#
# A change to docs/ or to a Markdown file at the root runs the consistency tests
# only: no other test reads those files. Any other change runs the full suite.

name: framework-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels the run of the commit it replaces. On main
# every run completes: the next push is compared with its parent only, so a
# cancelled run would leave its change untested.
concurrency:
  group: framework-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-dev.txt

      - name: scope (docs-only changes run the consistency tests)
        id: scope
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          full=true
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            if ! git diff --name-only "$BASE" "$GITHUB_SHA" | grep -qvE '^docs/|^[^/]+\.md$'; then
              full=false
            fi
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "full suite: $full"

      - name: tests (pytest)
        run: |
          if [ "${{ steps.scope.outputs.full }}" = true ]; then
            python -m pytest tests -q
          else
            python -m pytest tests/consistency -q
          fi

      - name: lint and format (ruff)
        run: |
          ruff check .
          ruff format --check .
