[project]
name = "quality-framework"
version = "1.1.1"
description = "Quality layer over any specification-driven method, organised by the ASPICE 4.1 processes."
requires-python = ">=3.10"
dependencies = ["PyYAML>=6,<7", "jsonschema>=4,<5"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["tests/.venv"]

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, pyupgrade, simplify
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The sample method skill holds header lines that must stay on one line.
"tests/consistency/test_plugins.py" = ["E501"]
