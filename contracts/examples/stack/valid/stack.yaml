contract: stack.v2

areas:
  - {area: language, tool: python, version: 3.12.7}
  - {area: runtime, tool: cpython, version: 3.12.7}
  - {area: package_manager, tool: uv, version: 0.4.20}
  - {area: frameworks, tool: fastapi, version: 0.115.2, purpose: HTTP API}
  - {area: libraries, tool: pydantic, version: 2.9.2, purpose: input validation}
  - {area: libraries, tool: httpx, version: 0.27.2, purpose: calls to the mail service}
  - {area: data_stores, tool: postgresql, version: "16.4", purpose: accounts and sessions}
  - {area: llm, not_needed: the product generates no text}
  - {area: external_services, tool: mail-service API, version: v2, purpose: password-reset mails}
  - {area: test_runner, tool: pytest, version: 8.3.3, version_command: pytest --version}
  - {area: test_runner, tool: pytest-benchmark, version: 4.0.0, version_command: pip show pytest-benchmark}
  - {area: lint, tool: ruff, version: 0.6.9, version_command: ruff --version, run: ruff check .}
  - {area: format, tool: ruff, version: 0.6.9, version_command: ruff --version, run: ruff format --check .}
  - {area: static_analysis, tool: mypy, version: 1.11.2, version_command: mypy --version, run: mypy src}
  - {area: secrets_scanner, tool: gitleaks, version: 8.21.2, version_command: gitleaks version,
     run: gitleaks detect --no-banner --report-format sarif --report-path build/secrets.sarif, results: build/secrets.sarif}
  - {area: dependencies_scanner, tool: osv-scanner, version: 1.9.1, version_command: osv-scanner --version,
     run: osv-scanner --format sarif --output build/dependencies.sarif -r ., results: build/dependencies.sarif}
  - {area: build, tool: hatchling, version: 1.25.0, purpose: wheel}
  - {area: deployment, tool: docker, version: 27.3.1, purpose: one image per release}
  - {area: version_control, tool: GitHub}
  - {area: ci_cd, tool: GitHub Actions}
  - {area: task_management, tool: GitHub Issues}
  - {area: requirements_engineering, tool: quality-framework/derive_requirements_plugin}
  - {area: diagram_tool, tool: archify}
  - {area: documentation, tool: mkdocs, version: 1.6.1, purpose: the operator's guide}

code_files: ["**/*.py"]
env_read_patterns: ['os\.getenv\("([A-Z0-9_]+)"\)']

decision_record: docs/decisions/0001-tech-stack.md
