contract: stack.v1

language: {name: python, version: 3.12.7}
runtime: {name: cpython, version: 3.12.7}
frameworks:
  - {name: fastapi, version: 0.115.2, purpose: HTTP API}
libraries:
  - {name: pydantic, version: 2.9.2, purpose: input validation}
data_stores:
  - {name: postgresql, version: "16.4", purpose: accounts and sessions}

code_files: ["**/*.py"]
test_files: ["**/test_*.py"]
integration_test_files: ["**/test_*.py"]
software_test_files: ["**/test_*.py"]
env_read_patterns: ['os\.getenv\("([A-Z0-9_]+)"\)']

suites:
  unit:        {run: pytest tests/unit --junitxml=build/unit.xml --cov --cov-report=xml:build/unit-coverage.xml, tool: pytest, version: 8.3.3, version_command: pytest --version,
                results: build/unit.xml, coverage: build/unit-coverage.xml}
  integration: {run: pytest tests/integration --junitxml=build/integration.xml, tool: pytest, version: 8.3.3, version_command: pytest --version,
                results: build/integration.xml}
  bench:       {run: pytest --benchmark-only --junitxml=build/bench.xml, tool: pytest-benchmark, version: 4.0.0, version_command: pip show pytest-benchmark,
                results: build/bench.xml}

checks:
  lint:   {run: ruff check ., tool: ruff, version: 0.6.9, version_command: ruff --version}
  format: {run: ruff format --check ., tool: ruff, version: 0.6.9, version_command: ruff --version}

decision_record: docs/decisions/0001-tech-stack.md
